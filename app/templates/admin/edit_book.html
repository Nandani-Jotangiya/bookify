{% extends "admin/layout.html" %}

{% block title %}Edit Book{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="panel-card">
            <div class="card-header">Edit Book</div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="post" action="/books/edit/{{ book.id }}">
                    {% include "partials/csrf_field.html" %}
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" name="title" class="form-control" value="{{ book.title }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Author</label>
                        <input type="text" name="author" class="form-control" value="{{ book.author }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">ISBN</label>
                        <input type="text" name="isbn" class="form-control" value="{{ book.isbn }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Price</label>
                        <input
                            type="number"
                            step="0.01"
                            name="price"
                            class="form-control"
                            value="{{ book.price }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Quantity</label>
                        <input
                            type="number"
                            name="quantity"
                            class="form-control"
                            value="{{ book.quantity }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Rent Per Day</label>
                        <input
                            type="number"
                            name="rent_per_day"
                            class="form-control"
                            value="{{ book.rent_per_day }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="4" required>{{ book.description }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="category_id" class="form-control" required>
                            {% for category in categories %}
                            <option
                                value="{{ category.id }}"
                                {% if category.id == book.category_id %}selected{% endif %}
                            >
                                {{ category.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Update Book</button>
                        <a href="/books" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
