<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bookify Admin{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="/static/css/panel.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="d-flex">

    <nav class="app-sidebar" aria-label="Admin navigation">

        <div class="brand">
            Bookify
        </div>

        <div class="nav-links">

            <a href="/admin/dashboard">
                Dashboard
            </a>

            <a href="/categories">
                Categories
            </a>

            <a href="/books">
                Books
            </a>

            <a href="/admin/requests">
                Book Requests
            </a>

            <a href="/admin/issued-books">
                Issue Books
            </a>

            <a href="/admin/history">
                History
            </a>

            <a href="/admin/notifications">

                Notifications

                {% if unread_admin_notification_count|default(0) > 0 %}

                    <span class="badge bg-danger">
                        {{ unread_admin_notification_count }}
                    </span>

                {% endif %}

            </a>

            <a href="/admin/chat/requests">
                Chat Requests
            </a>

        </div>

        <a href="/logout" class="nav-logout">
            Logout
        </a>

    </nav>

    <main class="app-content">

        {% block content %}
        {% endblock %}

    </main>

</div>

</body>

</html>
