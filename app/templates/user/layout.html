<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bookify User Panel{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/panel.css" rel="stylesheet">
</head>

<body>
    <div class="d-flex">
        <nav class="app-sidebar" aria-label="User navigation">
            <div class="brand">Bookify</div>
            <div class="nav-links">
                <a href="/user/dashboard">Dashboard</a>
                <a href="/user/books">Books</a>
                <a href="/user/my-requests">My Requests</a>
                <a href="/user/issued-books">Issued Books</a>
                <a href="/user/history">History</a>
                <a href="/notifications" class="nav-link">
                    Notifications

                    {% if unread_notification_count > 0 %}
                    <span class="badge bg-danger">
                        {{ unread_notification_count }}
                    </span>
                    {% endif %}
                </a>
            </div>
            <a href="/logout" class="nav-logout">Logout</a>
        </nav>

        <main class="app-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>

</html>
