version: "3.9"

services:
  db:
    image: postgres:15
    container_name: bookify_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookify_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # FIXED: Added healthcheck to verify Postgres is actually ready to receive traffic
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookify_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: bookify_app
    restart: always
    # FIXED: Configured dependency to explicitly wait for the healthcheck to pass
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bookify_db
      SECRET_KEY: bookify_super_secret_key_2026
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
