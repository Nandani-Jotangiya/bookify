<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookify Dashboard</title>

    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>

<div class="dashboard">

    <aside class="sidebar">
        <h2>Bookify</h2>

        <ul>
            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/categories">Categories</a></li>
            <li><a href="/books">Books</a></li>
            <li><a href="/requests">Requests</a></li>
            <li><a href="/history">History</a></li>
            <li><a href="/logout">Logout</a></li>
        </ul>
    </aside>

    <main class="content">

        <div class="header">
            <h1>Dashboard</h1>
            <p>Welcome to Bookify Library Management System</p>
        </div>

        <div class="cards">

            <div class="card">
                <h3>Total Books</h3>
                <p>120</p>
            </div>

            <div class="card">
                <h3>Total Users</h3>
                <p>45</p>
            </div>

            <div class="card">
                <h3>Issued Books</h3>
                <p>32</p>
            </div>

        </div>

        <div class="activity">
            <h2>Recent Activity</h2>

            <table>
                <tr>
                    <th>User</th>
                    <th>Book</th>
                    <th>Status</th>
                </tr>

                <tr>
                    <td>John</td>
                    <td>Python Basics</td>
                    <td>Issued</td>
                </tr>

                <tr>
                    <td>Sarah</td>
                    <td>FastAPI Guide</td>
                    <td>Returned</td>
                </tr>

            </table>
        </div>

    </main>

</div>

</body>
</html>
