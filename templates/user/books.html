{% extends "user/layout.html" %}

{% block content %}

<h2 class="mb-4">
    Available Books
</h2>

<table class="table table-bordered">

    <thead>
        <tr>
            <th>ID</th>
            <th>Book Name</th>
            <th>Author</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody>

        {% for book in books %}

        <tr>
            <td>{{ book.id }}</td>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>
    <form
        action="/user/request-book/{{ book.id }}"
        method="POST"
    >
        <button
            type="submit"
            class="btn btn-primary btn-sm"
        >
            Request
        </button>
    </form>
</td>
        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
