<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookify User Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            background-color: #f8f9fa;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: #7e8e65;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.15);
        }

        .content {
            flex-grow: 1;
            padding: 30px;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

    </style>
</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->

    <div class="sidebar">

        <div class="brand">
            📚 Bookify
        </div>

        <a href="/user/dashboard">
            Dashboard
        </a>

        <a href="/user/books">
            Books
        </a>

        <a href="/user/my-requests" class="nav-link">

            My Requests
        </a>

        <a href="/user/issued-books">
            Issued Books
        </a>

        <a href="/user/history">
            History
        </a>

        <a href="/logout">
            Logout
        </a>

    </div>

    <!-- Main Content -->

    <div class="content">

        {% block content %}
        {% endblock %}

    </div>

</div>

</body>
</html>
