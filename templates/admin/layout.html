<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Bookify Admin{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .sidebar {
            min-height: 100vh;
            background: #212529;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 12px 20px;
        }

        .sidebar a:hover {
            background: #343a40;
        }

        .content {
            padding: 25px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            padding: 20px;
            color: white;
            text-align: center;
            border-bottom: 1px solid #444;
        }
    </style>

</head>
<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">

            <div class="logo">
                📚 Bookify
            </div>

            <a href="/dashboard">Dashboard</a>
            <a href="/categories">Categories</a>
            <a href="/books">Books</a>
            <a href="#">Users</a>
            <a href="#">Issue Books</a>
            <a href="#">History</a>

        </div>

        <!-- Content -->
        <div class="col-md-10 content">

            {% block content %}
            {% endblock %}

        </div>

    </div>

</div>

</body>
</html>
