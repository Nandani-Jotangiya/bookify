{% extends "admin/layout.html" %}

{% block title %}
Edit Book
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header">
                <h4 class="mb-0">Edit Book</h4>
            </div>

            <div class="card-body">

                <form method="post" action="/books/edit/{{ book.id }}">

                    <!-- Title -->
                    <div class="mb-3">
                        <label class="form-label">Title</label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            value="{{ book.title }}"
                            required
                        >
                    </div>

                    <!-- Author -->
                    <div class="mb-3">
                        <label class="form-label">Author</label>

                        <input
                            type="text"
                            name="author"
                            class="form-control"
                            value="{{ book.author }}"
                            required
                        >
                    </div>

                    <!-- ISBN -->
                    <div class="mb-3">
                        <label class="form-label">ISBN</label>

                        <input
                            type="text"
                            name="isbn"
                            class="form-control"
                            value="{{ book.isbn }}"
                            required
                        >
                    </div>

                    <!-- Price -->
                    <div class="mb-3">
                        <label class="form-label">Price</label>

                        <input
                            type="number"
                            step="0.01"
                            name="price"
                            class="form-control"
                            value="{{ book.price }}"
                            required
                        >
                    </div>

                    <!-- Quantity -->
                    <div class="mb-3">
                        <label class="form-label">Quantity</label>

                        <input
                            type="number"
                            name="quantity"
                            class="form-control"
                            value="{{ book.quantity }}"
                            required
                        >
                    </div>

                    <!-- Description -->
                    <div class="mb-3">
                        <label class="form-label">Description</label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="4"
                            required
                        >{{ book.description }}</textarea>
                    </div>

                    <!-- Category -->
                    <div class="mb-3">
                        <label class="form-label">Category</label>

                        <select
                            name="category_id"
                            class="form-control"
                            required
                        >

                            {% for category in categories %}

                            <option
                                value="{{ category.id }}"
                                {% if category.id == book.category_id %}
                                selected
                                {% endif %}
                            >
                                {{ category.name }}
                            </option>

                            {% endfor %}

                        </select>
                    </div>

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Update Book
                        </button>

                        <a
                            href="/books"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
