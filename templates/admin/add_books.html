<!DOCTYPE html>
<html>

<head>
    <title>Add Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h2>Add Book</h2>

        <form method="post" action="/books/add">

            <input class="form-control mb-2" name="title" placeholder="Title">

            <input class="form-control mb-2" name="author" placeholder="Author">

            <input class="form-control mb-2" name="price" type="number" placeholder="Price">

            <textarea class="form-control mb-2" name="description" placeholder="Description"></textarea>
            <select class="form-control mb-3" name="category_id" required>

                <option value="">
                    Select Category
                </option>

                {% for category in categories %}
                <option value="{{ category.id }}">
                    {{ category.name }}
                </option>
                {% endfor %}

            </select>

            <button class="btn btn-success">Save Book</button>

        </form>

    </div>

</body>

</html>
