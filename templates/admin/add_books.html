{% extends "admin/layout.html" %}

{% block title %}
Add Book
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header">
                <h4 class="mb-0">Add Book</h4>
            </div>

            <div class="card-body">

                <form method="post" action="/books/add">

                    <!-- Title -->
                    <div class="mb-3">
                        <label class="form-label">
                            Title
                        </label>

                        <input type="text" name="title" class="form-control" placeholder="Enter book title" required>
                    </div>

                    <!-- Author -->
                    <div class="mb-3">
                        <label class="form-label">
                            Author
                        </label>

                        <input type="text" name="author" class="form-control" placeholder="Enter author name" required>
                    </div>

                    <!-- ISBN -->
                    <div class="mb-3">
                        <label class="form-label">
                            ISBN
                        </label>

                        <input type="text" name="isbn" class="form-control" placeholder="Enter ISBN number" required>
                    </div>

                    <!-- Price -->
                    <div class="mb-3">
                        <label class="form-label">
                            Price
                        </label>

                        <input type="number" step="0.01" name="price" class="form-control"
                            placeholder="Enter book price" required>
                    </div>

                    <!-- Quantity -->
                    <div class="mb-3">
                        <label class="form-label">
                            Quantity
                        </label>

                        <input type="number" name="quantity" class="form-control" placeholder="Enter quantity" required>
                    </div>
                    <div class="mb-3">
                        <label>Rent Per Day</label>

                        <input type="number" name="rent_per_day" class="form-control" required>
                    </div>
                    <!-- Description -->
                    <div class="mb-3">
                        <label class="form-label">
                            Description
                        </label>

                        <textarea name="description" class="form-control" rows="4" placeholder="Enter book description"
                            required></textarea>
                    </div>

                    <!-- Category -->
                    <div class="mb-3">
                        <label class="form-label">
                            Category
                        </label>

                        <select name="category_id" class="form-control" required>
                            <option value="">
                                Select Category
                            </option>

                            {% for category in categories %}
                            <option value="{{ category.id }}">
                                {{ category.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex gap-2">

                        <button type="submit" class="btn btn-success">
                            Save Book
                        </button>

                        <a href="/books" class="btn btn-secondary">
                            Back
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
