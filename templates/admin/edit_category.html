{% extends "admin/layout.html" %}

{% block title %}
Edit Category
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header">
                <h4>Edit Category</h4>
            </div>

            <div class="card-body">

                <form
                    method="post"
                    action="/categories/edit/{{ category.id }}"
                >

                    <div class="mb-3">

                        <label class="form-label">
                            Category Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            value="{{ category.name }}"
                            class="form-control"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Update
                    </button>

                    <a
                        href="/categories"
                        class="btn btn-secondary"
                    >
                        Back
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
